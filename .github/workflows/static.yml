name: Publish Image Code Portfolio

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "Image Code Portfolio.zip"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare portfolio
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          from shutil import copy2
          output = Path("_site").resolve()
          output.mkdir(exist_ok=True)
          with ZipFile("Image Code Portfolio.zip") as archive:
              for item in archive.infolist():
                  target = (output / item.filename).resolve()
                  if not target.is_relative_to(output):
                      raise ValueError("Invalid archive path")
              archive.extractall(output)
          copy2("index.html", output / "index.html")
          if not (output / "index.html").is_file():
              raise FileNotFoundError("The portfolio must contain index.html at its root")
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
